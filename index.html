<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <!-- PASTE YOUR EXPERIMENTHQ SNIPPET RIGHT HERE -->


    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f7fafc;
            color: #2d3748;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 480px;
            width: 100%;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 12px;
            color: #1a202c;
        }

        p {
            font-size: 16px;
            color: #4a5568;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        /* --- CTA BUTTON STYLES --- */
        .cta-btn {
            display: inline-block;
            background-color: #2563eb; /* Primary Blue */
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .cta-btn:hover {
            background-color: #1d4ed8;
            transform: translateY(-1px);
        }

        .cta-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Welcome to My Website</h1>
        <p>Explore my latest work, operational insights, and project updates.</p>

        <!-- CTA Button (Control / Baseline) -->
        <button id="main-cta-button" class="cta-btn" onclick="alert('Thank you for clicking!')">
            Explore Projects
        </button>
    </div>

</body>
</html>
